name: Deploy Dashboard

on:
  push:
    branches: [main]
    paths: [dashboard/**, docs/guide/**]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/configure-pages@v5

      - name: Assemble site (dashboard at root, guide at /guide/)
        run: |
          mkdir -p _site/guide
          cp -r dashboard/. _site/
          cp -r docs/guide/. _site/guide/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
